spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dulcepack}
    username: ${DB_USERNAME:dulcepack}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
